name: media_kit_libs_ios_video
description: >-
  OpenPlayX replacement for media_kit's iOS native libraries: libmpv built
  from source by package-media, linked to package-ffmpeg's FFmpeg.
version: 1.1.4+openplayx
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MediaKitLibsIosVideoPlugin
