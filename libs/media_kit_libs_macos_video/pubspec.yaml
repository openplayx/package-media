name: media_kit_libs_macos_video
description: >-
  OpenPlayX replacement for media_kit's macOS native libraries: libmpv built
  from source by package-media, linked to package-ffmpeg's FFmpeg. Use it via
  dependency_overrides.
version: 1.1.4+openplayx
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MediaKitLibsMacosVideoPlugin
