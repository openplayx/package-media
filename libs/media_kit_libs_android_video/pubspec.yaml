name: media_kit_libs_android_video
description: >-
  OpenPlayX replacement for media_kit's Android native libraries: libmpv built
  from source by package-media, linked to package-ffmpeg's FFmpeg.
version: 1.3.8+openplayx
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.alexmercerind.media_kit_libs_android_video
        pluginClass: MediaKitLibsAndroidVideoPlugin
